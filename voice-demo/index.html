<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Baptist Health voice survey call demo.">
  <meta name="robots" content="noindex, nofollow">
  <title>Baptist Health Voice Survey Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p>Baptist Health</p>
      <h1>Voice Survey Demo</h1>
    </header>

    <section id="access-required" class="access-required">
      <h2>Private team demo</h2>
      <p>Open the private operator link provided by the demo owner to manage contacts and place calls.</p>
    </section>

    <div id="operator-controls" hidden>
    <form id="contact-form" class="contact-form">
      <label>
        <span>Name</span>
        <input id="name" maxlength="100" autocomplete="off" placeholder="Zachary" required>
      </label>
      <label>
        <span>Phone number</span>
        <input id="phone" type="tel" inputmode="tel" maxlength="20" autocomplete="off" placeholder="+1 312 555 0123" required>
      </label>
      <button id="add-contact" class="add-button" type="submit">Add</button>
    </form>

    <section aria-label="People to call">
      <ul id="contact-list" class="contact-list"></ul>
      <p id="empty-list" class="empty-list">Add a name and phone number.</p>
    </section>

    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <button id="call-list" class="call-button" type="button" disabled>Call listed contacts</button>

    <section class="responses" aria-labelledby="responses-heading">
      <h2 id="responses-heading">Responses</h2>
      <p id="responses-empty" class="responses-empty">Survey responses will appear here as they are received.</p>
      <div id="response-list" class="response-list" aria-live="polite"></div>
    </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
